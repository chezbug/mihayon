<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Mihayon</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="/">mi<span>hayon</span></a>
      <nav>
        <a href="/edit">New document</a>
      </nav>
    </header>
    <main>
      <div id="status" class="status">Loading…</div>

      <div id="split-prompt" class="links" hidden>
        <h3>This is a split link</h3>
        <p class="muted-note">
          Reading it needs a second key part, delivered separately (a pasted
          string, or scan the QR with your phone and paste what it shows).
        </p>
        <div class="row">
          <input id="part-b" placeholder="Paste the second key part…" autocomplete="off" spellcheck="false" />
          <button id="unlock">Unlock</button>
        </div>
      </div>

      <article id="content" class="content" hidden></article>
      <div id="meta" class="meta"></div>
    </main>

    <!-- Vendored, self-hosted. No external network requests. -->
    <script src="/vendor/marked.min.js"></script>
    <script src="/vendor/purify.min.js"></script>
    <script type="module" src="/js/view.js"></script>
  </body>
</html>
